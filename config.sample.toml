# compfinder configuration
#
# Location: ${XDG_CONFIG_HOME:-~/.config}/compfinder/config.toml, or the file named by --config
# or the COMPFINDER_CONFIG environment variable. `compfinder config init` writes this template
# there; `compfinder config show` prints the effective settings and where each came from.
#
# Every setting is optional. Each is shown commented out at its default: uncomment a line to
# change it. Precedence, lowest first: built-in default, this file, environment variable,
# command-line flag. Where a setting has an environment override, its "Env:" line names it.
#
# This file can hold API keys. Keep it readable by you alone: chmod 600.

# Two-letter country code to prefer when a lookup doesn't give one.
# Env: COMPFINDER_COUNTRY. Flag: --country.
# country = "GB"

# Log level: warn | info | debug. Errors are always written. Logs go to stderr.
# Env: COMPFINDER_LOG_LEVEL.
# log_level = "info"

# Where the logo and response caches live. Safe to delete at any time.
# Default: ${XDG_CACHE_HOME:-~/.cache}/compfinder.
# Env: COMPFINDER_CACHE_DIR. Flag: --cache-dir.
# cache_dir = "~/.cache/compfinder"

# Skip a metered provider when every field it could supply is already at confidence 100.
# skip_settled = true

[budgets]
# Most metered provider calls one lookup may make. 0 means free providers only. 0 to 100.
# Flag: --max-metered-calls.
# metered_calls_per_lookup = 5

# Most metered provider calls a whole batch (find --input) may make. 0 means no limit.
# Flag: --max-metered-calls-total.
# metered_calls_per_batch = 0

[timeouts]
# Longest any single request may take, in milliseconds. 1000 to 120000.
# request_ms = 10000

# Longest a whole lookup may take, in milliseconds. 1000 to 600000. Not less than request_ms.
# lookup_ms = 30000

[web_fetch]
# Most pages read from a business's site per lookup. 1 to 20.
# max_pages = 5

# Honour the site's robots.txt. Turning this off is your responsibility.
# honour_robots = true

# A page with less visible text than this, and no structured data, is reported as unreadable
# (it probably builds its content with JavaScript). 0 to 10000 characters.
# unreadable_text_chars = 200

[discover]
# Hosts whose pages are directory listings, never taken as a business's own website.
# directory_hosts = [
#   "yell.com", "thomsonlocal.com", "scoot.co.uk", "cylex-uk.co.uk", "checkatrade.com", "trustpilot.com",
#   "yelp.com", "yelp.co.uk", "tripadvisor.com", "tripadvisor.co.uk",
#   "facebook.com", "instagram.com", "linkedin.com", "x.com", "twitter.com", "youtube.com", "tiktok.com",
#   "rightmove.co.uk", "zoopla.co.uk", "onthemarket.com",
#   "find-and-update.company-information.service.gov.uk", "opencorporates.com", "endole.co.uk",
#   "wikipedia.org", "google.com", "bing.com",
# ]

[net]
# Let requests reach private, loopback and link-local addresses. For testing only.
# Flag: --allow-private-addresses.
# allow_private_addresses = false

[priority]
# Which provider's value is shown when sources disagree and nothing else settles it, and which
# providers are called first under a budget. Priority never changes a confidence score.
# Providers you list come first, in your order; the rest follow in the default order shown.
# name = ["web-fetch", "google-places-api"]
# website = ["web-fetch", "google-places-api", "brave-search-api"]
# address = ["google-places-api", "web-fetch"]
# phone = ["web-fetch", "google-places-api"]
# email = ["web-fetch"]
# logo = ["web-fetch"]
# place_id = ["google-places-api"]
# socials = ["web-fetch"]

# ---- Providers ----
# A provider with an API key is configured once the key is set. `enabled = false` switches a
# provider off without removing its key.

[providers.web-fetch]
# Reads the business's own pages. Needs no key.
# enabled = true

[providers.google-places-api]
# Google Places API (New). Metered.
# Env: COMPFINDER_GOOGLE_PLACES_API_KEY.
# api_key = ""
# enabled = true

[providers.brave-search-api]
# Brave Search API web results. Metered.
# Env: COMPFINDER_BRAVE_SEARCH_API_KEY.
# api_key = ""
# enabled = true
